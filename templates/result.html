<!DOCTYPE html>
<html>
<head>
    <title>LegalEase - Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 600px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            margin-top: 12px;
            margin-right: 8px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .links {
            margin-top: 25px;
        }

        .links a {
            margin-right: 20px;
            color: #222;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #fff3cd;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚖️ LegalEase</h1>

    <h2>{{ document_type }}</h2>

    <form method="post" action="/download-pdf">
        <textarea name="document">{{ document }}</textarea>
        <button type="submit">Download PDF</button>
    </form>

    <form method="post" action="/download-docx">
        <textarea name="document">{{ document }}</textarea>
        <button type="submit">Download DOCX</button>
    </form>

    <div class="note">
        You can edit the generated document before downloading.
    </div>

    <div class="links">
        <a href="/">← Create Another Document</a>
        <a href="/history">View History</a>
    </div>

</div>

</body>
</html>
