<!DOCTYPE html>
<html>
<head>
    <title>LegalEase - Generate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .type {
            background: #eee;
            padding: 12px;
            border-radius: 6px;
            margin: 20px 0;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #222;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚖️ LegalEase</h1>

    <div class="type">
        Document Type:
        {{ document_type or "Employment Contract" }}
    </div>

    <form action="/generate" method="POST">

        <!-- Document Type -->
        <input
            type="hidden"
            name="document_type"
            value="{{ document_type or 'Employment Contract' }}"
        >

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter full name"
            required
        >


        <label>Company / Organization</label>

        <input
            type="text"
            name="company"
            placeholder="Enter company name"
        >


        <label>Effective Date</label>

        <input
            type="date"
            name="date"
        >


        <label>Job Role / Purpose</label>

        <input
            type="text"
            name="role"
            placeholder="Example: Software Developer"
        >


        <label>Address</label>

        <input
            type="text"
            name="address"
            placeholder="Enter address"
        >


        <label>Additional Terms</label>

        <textarea
            name="terms"
            placeholder="Enter additional terms"
        ></textarea>


        <button type="submit">
            Generate Legal Document
        </button>

    </form>

    <a class="back" href="/">
        ← Back to Home
    </a>

</div>

</body>
</html>
