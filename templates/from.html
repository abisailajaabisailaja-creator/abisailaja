<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LegalEase - Generate Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #333;
        }

        .document-type {
            background: #f0f2f5;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>LegalEase</h1>

        <p class="subtitle">
            AI-Powered Legal Document Generator
        </p>

        <!-- Selected Document Type -->
        <div class="document-type">
            Document Type:
            {{ document_type }}
        </div>

        <!-- IMPORTANT: document_type is INSIDE the form -->
        <form action="/generate" method="post">

            <input
                type="hidden"
                name="document_type"
                value="{{ document_type }}"
            >

            <label for="name">
                Full Name <span class="required">*</span>
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="company">
                Company / Organization
            </label>

            <input
                type="text"
                id="company"
                name="company"
                placeholder="Enter company or organization name"
            >


            <label for="date">
                Effective Date
            </label>

            <input
                type="date"
                id="date"
                name="date"
            >


            <label for="role">
                Job Role / Purpose
            </label>

            <input
                type="text"
                id="role"
                name="role"
                placeholder="Example: Software Developer"
            >


            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                name="address"
                placeholder="Enter address"
            >


            <label for="terms">
                Additional Terms
            </label>

            <textarea
                id="terms"
                name="terms"
                placeholder="Enter any additional requirements or terms..."
            ></textarea>


            <button type="submit">
                Generate Legal Document
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
